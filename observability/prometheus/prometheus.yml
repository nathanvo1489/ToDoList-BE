scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 1m
    static_configs:
      - targets: ["localhost:9090"]
  
  - job_name: "backend-node"
    scrape_interval: 1m
    static_configs:
      - targets: ["host:9100"]

  - job_name: "frontend-node"
    scrape_interval: 1m
    static_configs:
      - targets: ["13.214.123.0:9100"]